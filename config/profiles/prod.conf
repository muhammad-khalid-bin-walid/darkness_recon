# Dark Recon Framework v4 - Production Profile
# Full scanning for production security assessments

# Global settings
DEBUG_MODE=false
GRACEFUL_DEGRADATION=false
QUIET=false
THREADS=200
TIMEOUT=600
RATE_LIMIT=1500
MAX_RETRIES=3

# Phase flags - full scanning
WAF_CHECK=true
NUCLEI_CHECK=true
PORT_SCAN=true
SSL_CHECK=true
API_SCAN=true
GIT_SCAN=true
SECRETS_SCAN=true
CLOUD_SCAN=true
VULN_SCAN=true
SERVICE_SCAN=true
DNS_SSL_WHOIS_SCAN=true
DISTRIBUTED_SCAN=true
OSINT_INTEL=true
THREAT_INTEL=true
BUSINESS_LOGIC=true
ADVANCED_EXPLOITATION=true
DATABASE_SCAN=true
WEBHOOKS_SCAN=true
CICD_SCAN=true
ML_ANALYSIS=true
COMPLIANCE_SCAN=true
SCOPE_PROGRAM=true
TARGET_INTAKE=true
HISTORICAL_RECON=true
THIRD_PARTY=true
EXPLOITATION_VALIDATION=true
POST_EXPLOITATION=true
DATA_EXFILTRATION=true
CONTINUOUS_MONITORING=true
HOWTOHUNT_METHOD=true

# Tool configuration
DEFAULT_THREADS=200
DEFAULT_TIMEOUT=600
DEFAULT_RATE_LIMIT=1500

# Parallel execution
PARALLEL_JOBS=16
ENABLE_PARALLEL=true

# Output
OUTPUT_FORMAT=both
GENERATE_HTML=true
GENERATE_CSV=true
GENERATE_SQLITE=true
WEBHOOK_NOTIFY=true

# Distributed scanning
DISTRIBUTED_WORKERS=8
KUBERNETES_NAMESPACE=dark-recon-prod
DOCKER_IMAGE=dark-recon-framework:latest

# Continuous monitoring
MONITORING_ENABLED=true
RESCAN_SCHEDULE=weekly
ALERT_THRESHOLD=high

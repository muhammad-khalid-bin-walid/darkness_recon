name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest --tb=short -v

  bats:
    name: Shell Tests (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats

      - name: Run bats tests
        run: |
          if [ -d tests/bats ] && ls tests/bats/*.bats 2>/dev/null; then
            bats tests/bats/*.bats
          else
            echo "No bats tests found, skipping"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          pip install ruff

      - name: Run ruff
        run: ruff check lib/ tests/ --ignore E501

      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck
          find phases/ lib/ scripts/ -name "*.sh" | xargs shellcheck --severity=warning || true
